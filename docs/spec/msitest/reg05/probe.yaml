# REG-05 probe: a file type written by msi-builder. When REG-05 ran (PR #120),
# packages with fileTypes carried the BuilderAssocChanged action, which called
# SHChangeNotify, and kept .ext in a permanent component. Both were removed
# later (MSISPEC chapter 16), so a build from main equals "baseline"; check
# out ba5362f to repeat the original run.
schema: msi-builder/v1

product:
  name: Reg05Probe
  manufacturer: MsiSpecProbe
  version: 1.0.0
  upgradeCode: 3b1f6f0e-8c7d-4f0a-9a52-0d6e2c4b7a11

package:
  platform: x64

ui:
  enabled: false

components:
  - files:
      - source: hello.exe
        fileTypes:
          - progId: MsiSpecReg05.Probe
            description: REG-05 probe
            extensions:
              - extension: reg05p
