name: Release

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-26.04
    name: Test goreleaser
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: 0

      - name: Check for the CLI
        id: cli
        run: |
          if [ -d cmd/go-msi ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::cmd/go-msi does not exist yet, skipping the goreleaser snapshot."
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.cli.outputs.present == 'true'
        with:
          go-version-file: 'go.mod'
          cache: "${{ github.actor != 'renovate[bot]' }}"

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: steps.cli.outputs.present == 'true'

      - name: go build (with goreleaser)
        if: steps.cli.outputs.present == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # renovate: github=goreleaser/goreleaser
          version: v2.19.0
          args: release --snapshot
        env:
          GITHUB_TOKEN: ""

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.cli.outputs.present == 'true'
        with:
          name: dists
          path: dist/

  publish:
    name: Publish release
    environment: Publish
    # Tags created by the Create Tag workflow start this workflow by workflow_dispatch.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && startsWith(github.ref, 'refs/tags/v')
    needs:
      - goreleaser
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # renovate: github=goreleaser/goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Publish Release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
