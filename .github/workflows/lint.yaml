name: Lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: "${{ github.actor != 'renovate[bot]' }}"

      - run: go mod tidy -diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: github=golangci/golangci-lint
          version: v2.15.0
          # Build golangci-lint with the Go version from go.mod. Release binaries
          # are built with an older Go and refuse to lint a newer go.mod.
          install-mode: goinstall
          args: "--max-same-issues=0"
          # The config package predates this linter config. Report findings in
          # changed code only, until the existing findings are fixed.
          only-new-issues: true
