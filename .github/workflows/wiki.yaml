name: Push to GH Wiki

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/wiki.yaml
      - .github/scripts/wiki.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'true'
          repository: ${{ github.repository }}.wiki
          path: wiki.git

      # Flattens docs/ into wiki pages, drops the title line and rewrites the
      # links; see docs/README.md.
      - name: sync wiki
        run: python3 -I .github/scripts/wiki.py docs wiki.git

      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff-index --quiet HEAD || git commit -m "Automatically publish wiki" && git push
        working-directory: wiki.git
