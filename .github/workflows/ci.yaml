name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions: {}

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - windows-latest
    permissions:
      contents: read
      # Codecov upload without a token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: "${{ github.actor != 'renovate[bot]' }}"

      - name: go build
        run: go build ./...

      # The full ICE suite (darice.cub) comes with MsiVal2 in the Windows SDK
      # and may not be redistributed, so it is fetched here and checked by
      # hash. When Microsoft ships a new SDK the hashes change: update them
      # after checking the new files on Windows.
      - name: Install the ICE suite
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SDK_URL: https://go.microsoft.com/fwlink/?linkid=2382519
          SDK_SHA256: E8E264ACA8BC34ABDF592352BF09F986A85CDB96DB0EFBA405CA9E149181FE61
          MSIVAL2_SHA256: 74BCFD1B9DEB0AF32EC8A1CE95D7340DC2F6FE0510D534A92AEE6E7F111D9C26
          CUB_SHA256: 9C5E0525F68E8522860D106FE4C7BD77B1742F70E37EA0962687B1C1D5E2293B
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-Hash($path, $want) {
            $got = (Get-FileHash -Algorithm SHA256 $path).Hash
            if ($got -ne $want) { throw "$path has SHA-256 $got, want $want" }
          }
          Invoke-WebRequest -Uri $env:SDK_URL -OutFile C:\winsdksetup.exe
          Assert-Hash C:\winsdksetup.exe $env:SDK_SHA256
          # A long layout path fails with exit code 2002.
          $p = Start-Process C:\winsdksetup.exe -Wait -PassThru -ArgumentList '/features OptionId.MSIInstallTools /layout C:\sdk /quiet /norestart'
          if ($p.ExitCode -ne 0) { throw "winsdksetup /layout exited with $($p.ExitCode)" }
          $msi = 'C:\sdk\Installers\MsiVal2-x86_en-us.msi'
          Assert-Hash $msi $env:MSIVAL2_SHA256
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i `"$msi`" /qn /norestart"
          if ($p.ExitCode -ne 0) { throw "MsiVal2 install exited with $($p.ExitCode)" }
          $cub = Join-Path ${env:ProgramFiles(x86)} 'MsiVal2\darice.cub'
          Assert-Hash $cub $env:CUB_SHA256
          "GO_MSI_ICE_CUB=$cub" >> $env:GITHUB_ENV
          'GO_MSI_ICE_REQUIRED=1' >> $env:GITHUB_ENV

      # Windows runs the native tests too: they open the built packages with
      # msi.dll, run the ICE suite and install them with msiexec. They are
      # skipped with -short.
      - name: go test
        shell: bash
        run: go test ./... ${{ runner.os != 'Windows' && '-short' || '' }} -shuffle=on -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./...

      # Print the Windows signature experiments (MSISPEC-RESULTS SIG-01…06).
      - name: go test (signature results)
        if: runner.os == 'Windows'
        shell: bash
        run: go test -v -count=1 -run 'TestSignature' ./pkg/builder/nativetest/

      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: runner.os == 'Linux'
        with:
          use_oidc: true
          files: coverage.out

  install-test:
    name: Install test (Wine)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - name: Check for the install test
        id: script
        run: |
          if [ -f hack/test-wine.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::hack/test-wine.sh does not exist yet, skipping the install test."
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.script.outputs.present == 'true'
        with:
          go-version-file: 'go.mod'
          cache: "${{ github.actor != 'renovate[bot]' }}"

      - name: Install Wine
        if: steps.script.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64 xvfb

      - name: Install examples/minimal
        if: steps.script.outputs.present == 'true'
        run: hack/test-wine.sh

  goreleaser:
    runs-on: ubuntu-26.04
    name: Test goreleaser
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: 0

      - name: Check for the CLI
        id: cli
        run: |
          if [ -d cmd/go-msi ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::cmd/go-msi does not exist yet, skipping the goreleaser snapshot."
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.cli.outputs.present == 'true'
        with:
          go-version-file: 'go.mod'
          cache: "${{ github.actor != 'renovate[bot]' }}"

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        if: steps.cli.outputs.present == 'true'

      - name: Set up Docker Buildx
        if: steps.cli.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: go build (with goreleaser)
        if: steps.cli.outputs.present == 'true'
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # renovate: github=goreleaser/goreleaser
          version: v2.19.0
          args: release --snapshot
        env:
          GITHUB_TOKEN: ""

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.cli.outputs.present == 'true'
        with:
          name: dists
          path: dist/

  lint:
    name: lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: "${{ github.actor != 'renovate[bot]' }}"

      - run: go mod tidy -diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # renovate: github=golangci/golangci-lint
          version: v2.15.0
          # Build golangci-lint with the Go version from go.mod. Release binaries
          # are built with an older Go and refuse to lint a newer go.mod.
          install-mode: goinstall
          args: "--max-same-issues=0"
          # The config package predates this linter config. Report findings in
          # changed code only, until the existing findings are fixed.
          only-new-issues: true

  super-lint:
    name: super-lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MULTI_STATUS: false
          LINTER_RULES_PATH: .
          # The Windows test harness and its raw run logs.
          FILTER_REGEX_EXCLUDE: docs/spec/msitest/.*
          GITHUB_ACTIONS_ZIZMOR_CONFIG_FILE: ./.github/zizmor.yml
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          SAVE_SUPER_LINTER_SUMMARY: true
          VALIDATE_ALL_CODEBASE: true
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GIT_MERGE_CONFLICT_MARKERS: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GO_RELEASER: true
          VALIDATE_HTML: true
          VALIDATE_JSON: true
          VALIDATE_NATURAL_LANGUAGE: true
          VALIDATE_RENOVATE: true
          VALIDATE_SHELL_SHFMT: true
          VALIDATE_SPELL_CODESPELL: true
          VALIDATE_XML: true
          VALIDATE_YAML: true

  publish:
    name: Publish release
    environment: Publish
    # Tags created by the Create Tag workflow start this workflow by workflow_dispatch.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - lint
      - goreleaser
      - super-lint
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: 'false'
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          # renovate: github=goreleaser/goreleaser
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Publish Release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt

      # parse artifacts to the format required for image attestation
      # https://github.com/goreleaser/goreleaser/issues/4852#issuecomment-2122790132
      - run: |
          echo "digest=$(echo "$ARTIFACTS" | jq -r '[.[]|select(.type=="Docker Image")][0]|.extra.Digest')" | tee /dev/stderr >> "$GITHUB_OUTPUT"
          echo "name=$(echo "$ARTIFACTS" | jq -r '[.[]|select(.type=="Docker Image")][0]|.name|split(":")[0]')" | tee /dev/stderr >> "$GITHUB_OUTPUT"
        id: image_metadata
        env:
          ARTIFACTS: ${{steps.goreleaser.outputs.artifacts}}

      # attest image
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-digest: ${{steps.image_metadata.outputs.digest}}
          subject-name: ${{steps.image_metadata.outputs.name}}
          push-to-registry: true
