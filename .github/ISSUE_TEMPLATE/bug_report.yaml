name: 🐞 Bug
description: Something is not working as intended.
labels: [ 🐞 bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Before you submit this issue, please make sure you have read the documentation and searched for similar issues.
        If you have done that, please fill out the template below.

  - type: textarea
    attributes:
      label: Current Behavior
      description: A concise description of what you're experiencing.
      placeholder: |
        When I do <X>, <Y> happens and I see the error message attached below:
        ```...```
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior
      description: A concise description of what you expected to happen.
      placeholder: When I do <X>, <Z> should happen instead.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. With this config...
        2. Run 'go-msi build ...'
        3. Install the package with 'msiexec /i package.msi /l*v install.log'
        4. See error...
      render: Markdown
    validations:
      required: false

  - type: textarea
    attributes:
      label: Environment
      description: |
        examples:
        - **go-msi Version**: 0.1.0
        - **Build OS / Arch**: Linux / amd64
        - **Install OS**: Windows Server 2025
      value: |
        - go-msi Version:
        - Build OS / Arch:
        - Install OS:
    validations:
      required: true

  - type: textarea
    attributes:
      label: go-msi configuration
      description: |
        The YAML configuration passed to go-msi. Remove secrets and internal names.
      render: yaml
    validations:
      required: true

  - type: textarea
    attributes:
      label: go-msi output
      description: |
        Output of the go-msi command that built the package.
      render: shell
    validations:
      required: true

  - type: textarea
    attributes:
      label: Windows Installer log
      description: |
        If the package fails to install, upgrade or uninstall, attach the verbose log of `msiexec /l*v install.log`.
      render: shell
    validations:
      required: false

  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about the issue you are encountering!

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false

  - type: checkboxes
    id: documentation
    attributes:
      label: Preflight Checklist
      options:
        - required: true
          #language=markdown
          label: |
            I could not find a solution in the [documentation](https://github.com/jkroepke/go-msi/wiki),
            the existing issues or discussions.
