# The CA-03 probe of the embedded custom action DLL: every kind of run
# action, installed by pkg/builder/nativetest (TestMsiexecRunActions) and by
# docs/spec case CA-03. ARCH selects the platform and so the DLL.
schema: msi-builder/v1

vars:
  ARCH: x64

product:
  name: BuilderRunProbe
  manufacturer: msi-builder
  version: 1.0.0
  upgradeCode: 7d1f6c2e-5a1b-4c3d-9e8f-0a1b2c3d4e5f

package:
  platform: ${ARCH}

components:
  - files:
      - source: readme.txt

properties:
  FAILPROBE:
    value: '0'
    secure: true

customActions:
  - id: ProbeDeferredSystem
    run:
      command: '"[System64Folder]cmd.exe" /c echo deferred-system [ProductName] & whoami & echo brackets [\[]ProductName] stay literal & echo oem-umlaut-äöü & dir /b & echo stderr-line 1>&2'
      directory: INSTALLDIR
    execute: deferred
    impersonate: false
    return: check
    # Not on removal: RemoveFiles has deleted the working directory by then
    # and CreateProcess fails with 267 (seen on the first CI run).
    schedule:
      - { sequence: execute, after: InstallFiles, condition: NOT REMOVE~="ALL" }

  - id: ProbeDeferredUser
    run:
      command: '"[System64Folder]cmd.exe" /c echo deferred-user & whoami & cd'
    execute: deferred
    impersonate: true
    return: check
    schedule:
      - { sequence: execute, after: InstallFiles }

  - id: ProbeRollback
    run:
      command: '"[System64Folder]cmd.exe" /c echo rollback-ran & whoami'
    execute: rollback
    impersonate: false
    return: ignore
    schedule:
      - { sequence: execute, after: InstallFiles }

  - id: ProbePowerShell
    run:
      command: '"[System64Folder]WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -Command "Write-Output (\"powershell says \" + $PSVersionTable.PSVersion); Write-Error oops; exit 0"'
    execute: deferred
    impersonate: false
    return: check
    schedule:
      - { sequence: execute, after: InstallFiles }

  # The UTF-8 line comes from PowerShell: `chcp 65001` inside `cmd /c` does
  # not switch cmd.exe's echo on the pipe (it stayed OEM and wrote € as ?
  # on the x64 and Arm64 runners); PowerShell honours [Console]::OutputEncoding.
  - id: ProbeUtf8
    run:
      command: '"[System64Folder]WindowsPowerShell\v1.0\powershell.exe" -NoProfile -Command "[\[]Console]::OutputEncoding = New-Object Text.UTF8Encoding $false; ''utf8-umlaut-äöü-euro-€''"'
    execute: deferred
    impersonate: false
    return: check
    schedule:
      - { sequence: execute, after: InstallFiles }

  - id: ProbeIgnored
    run:
      command: '"[System64Folder]cmd.exe" /c echo ignored-exit-3 & exit 3'
    execute: deferred
    impersonate: false
    return: ignore
    schedule:
      - { sequence: execute, after: InstallFiles }

  - id: ProbeFails
    run:
      command: '"[System64Folder]cmd.exe" /c echo about-to-fail & exit 7'
    execute: deferred
    impersonate: false
    return: check
    hideTarget: true
    schedule:
      - { sequence: execute, after: InstallFiles, condition: FAILPROBE="1" }

  - id: ProbeImmediate
    run:
      command: '"[System64Folder]cmd.exe" /c echo immediate-after-finalize & whoami'
    return: check
    schedule:
      - { sequence: execute, after: InstallFinalize }
