# yaml-language-server: $schema=https://raw.githubusercontent.com/jkroepke/msi-builder/main/pkg/config/schema.json
# Converted from actions.wxs by msi-builder convert.
# Review it, resolve the TODO comments, then run msi-builder validate.
# TODO(line 5): the WiX package has no MajorUpgrade; msi-builder adds the standard major upgrade (set upgrade: false to leave it out)
# TODO(line 85): the Error row 1316 has no counterpart; only error actions take in their message
schema: msi-builder/v1
product:
  name: Hello
  manufacturer: Example
  version: 1.0.0
  upgradeCode: 0b7e8c41-2f6d-4a39-8c15-7d2e9f0a6b54
package:
  platform: x64
  installerVersion: "5.0"
upgrade:
  property: WIX_UPGRADE_DETECTED
installDir:
  id: INSTALLFOLDER
  name: Hello
components:
  # TODO(line 23): util:RemoveFolderEx was not converted: purge refuses a folder below INSTALLFOLDER, a directory that can point anywhere; keep the data in a folder with private (mixed-case) IDs below a fixed standard folder, such as CommonAppDataFolder/Vendor/Product, and purge that
  - id: HelloExe
    directory: bin
    files:
      - source: dist/readme.txt
        id: readme.txt
      - source: dist/hello.exe
        id: hello.exe
        shortcuts:
          # Advertised: becomes a plain shortcut to the component's key file.
          # TODO(line 19): advertised shortcuts are never supported; this one is a plain shortcut
          - name: Hello
            directory: ProgramMenuFolder/Hello
    services:
      - name: HelloSvc
        start: auto
        recovery:
          actions: [restart, restart, none]
          restartDelay: 0s
    keyPath: hello.exe
  # Controls the service of another component.
  # TODO(line 26): the condition "&Complete = 3" was left out: it tests the action state &Complete, which is not set yet when the installer evaluates component conditions; test a property instead
  # TODO(line 28): the ServiceControl for HelloSvc became services[].control of the component that installs it, which keeps that component's condition and feature instead of this one's
  - id: HelloSvcControl
    files:
      - source: dist/hello.yaml
        id: hello.yaml
  # A second control of the same service, which is left out.
  # TODO(line 33): the ServiceControl for HelloSvc was left out: msi-builder takes one control per service, and services[].control comes from the ServiceControl on line 28; merge the events there
  - id: HelloSvcRestart
    files:
      - source: dist/hello.ini
        id: hello.ini
  # The key file has no Id; the advertised shortcut starts it.
  - id: Tray
    files:
      - source: dist/helper.dll
      - source: dist/tray.exe
        shortcuts:
          # TODO(line 39): advertised shortcuts are never supported; this one is a plain shortcut
          - name: Hello Tray
            directory: ProgramMenuFolder/Hello
    keyPath: tray.exe
  # An & in a string is no action state.
  - id: RnD
    files:
      - source: dist/rnd.txt
        id: rnd.txt
    condition: EDITION="R&D"
  # TODO(line 52): RemoveRegistryKey HKCR\*\shell\Hello was left out: msi-builder has no removal on uninstall only, and removeRegistry removes the key on install
  # TODO(line 53): RemoveRegistryValue HKCU\Software\Example\Hello without Name removes the default value and was left out: removeRegistry without name removes the whole key
  # The RemoveFolder and HKCU key path of this shortcut component were left out:
  # msi-builder writes both for every shortcut.
  - id: ConsoleLink
    directory: ProgramMenuFolder/Hello
    registry:
      - root: HKCU
        key: Software\Example\Hello\Handlers
        name: PlayMedia
        value: ""
    shortcuts:
      # The target is a property that holds a URL, not a folder.
      - name: Hello Console
        program: '[CONSOLEURL]'
        directory: ProgramMenuFolder/Hello
properties:
  CONSOLEURL: http://localhost:4985/
customActions:
  - id: StopHello
    run:
      command: '"[System64Folder]taskkill.exe" /im hello.exe /f'
    return: ignore
    # TODO(line 65): Wix4CloseApplications_X64 is an action of a WiX extension, which the msi-builder package does not have; convert placed this action after CostFinalize, check that place
    schedule:
      - {sequence: execute, after: CostFinalize}
  - id: Greet
    run:
      command: '"[System64Folder]cmd.exe" /c echo hello'
    return: ignore
    schedule:
      - {sequence: execute, after: InstallFinalize, when: install}
  - id: Cleanup
    run:
      command: '"[#hello.exe]" cleanup'
    return: ignore
    schedule:
      - {sequence: execute, before: RemoveFiles, when: uninstall}
  - id: Register
    run:
      command: '"[#hello.exe]" register'
    execute: deferred
    impersonate: false
    return: check
    schedule:
      - {sequence: execute, after: InstallFiles, condition: NOT Installed}
  # Started without waiting for it, and an error with its own message.
  - id: StartTray
    exec:
      command: '"[#hello.exe]" --tray'
    return: asyncNoWait
    schedule:
      - {sequence: execute, after: InstallFinalize, condition: NOT REMOVE}
  - id: StartMonitor
    # TODO(line 77): check [MONITOR]: quote it if it holds a bare path; leave it if it holds a quoted command line such as an UninstallString
    exec:
      command: '[MONITOR] --monitor'
      directory: INSTALLFOLDER
    return: asyncNoWait
    schedule:
      - {sequence: execute, after: StartTray, condition: NOT REMOVE}
  - id: NeedsAdmin
    error: Hello needs administrator rights.
    schedule:
      - {sequence: execute, after: LaunchConditions, condition: NOT Privileged}
  # Placed on actions of a WiX extension.
  - id: Configure
    run:
      command: '"[#hello.exe]" --configure'
    execute: deferred
    impersonate: false
    return: check
    # TODO(line 80): Wix4ExecFirewallExceptionsInstall_X64 is an action of a WiX extension, which the msi-builder package does not have; convert placed this action after InstallFiles, check that place
    schedule:
      - {sequence: execute, after: InstallFiles, condition: NOT Installed}
  - id: UndoConfigure
    run:
      command: '"[#hello.exe]" --unconfigure'
    execute: rollback
    impersonate: false
    return: check
    # TODO(line 81): Wix4ExecFirewallExceptionsInstall_X64 is an action of a WiX extension, which the msi-builder package does not have; convert placed this action before InstallFiles, check that place
    schedule:
      - {sequence: execute, before: InstallFiles, condition: NOT Installed}
  - id: SetCLOSING
    setProperty: {name: CLOSING, value: "1"}
    # TODO(line 82): Wix4CloseApplications_X64 is an action of a WiX extension, which the msi-builder package does not have; convert placed this action before CostFinalize, check that place
    schedule:
      - {sequence: execute, before: CostFinalize}
