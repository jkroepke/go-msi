# yaml-language-server: $schema=https://raw.githubusercontent.com/jkroepke/go-msi/main/config/schema.json
# The smallest useful package: one executable, silent install only.
#
# Everything else has a default: the file goes to "Program Files\Hello"
# (INSTALLDIR, which can be set on the command line), into one feature, and
# a newer version replaces an installed one.
schema: go-msi/v1

product:
  name: Hello
  manufacturer: Example
  version: 1.0.0
  upgradeCode: 3f2504e0-4f89-41d3-9a0c-0305e82c3301

package:
  platform: x64

components:
  - files:
      - source: hello.exe
