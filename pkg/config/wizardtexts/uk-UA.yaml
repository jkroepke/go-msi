ReadyInstallTitle: "Усе готово до інсталяції [ProductName]"
ReadyInstallText: "Натисніть «Інсталювати», щоб почати інсталяцію. Натисніть «Назад», щоб переглянути або змінити параметри. Натисніть «Скасувати», щоб вийти з майстра."
ReadyRepairTitle: "Усе готово до відновлення [ProductName]"
ReadyRepairText: "Натисніть «Відновити», щоб відновити інсталяцію [ProductName]. Натисніть «Назад», щоб повернутися до меню обслуговування, або «Скасувати», щоб вийти з майстра."
ReadyRemoveTitle: "Видалення [ProductName]"
ReadyRemoveText: "Натисніть «Видалити», щоб видалити [ProductName] з комп'ютера. Натисніть «Назад», щоб повернутися до меню обслуговування, або «Скасувати», щоб вийти з майстра."

MaintenanceWelcomeTitle: "Вітає майстер інсталяції [ProductName]"
MaintenanceWelcomeText: "Майстер інсталяції дає змогу змінити спосіб інсталяції компонентів [ProductName] на комп'ютері або видалити програму з комп'ютера. Натисніть «Далі», щоб продовжити, або «Скасувати», щоб вийти з майстра інсталяції."
MaintenanceTypeTitle: "Зміна, відновлення або видалення інсталяції"
MaintenanceTypeText: "Виберіть потрібну операцію."
MaintenanceChange: "&Змінити"
MaintenanceChangeText: "Дає змогу змінити спосіб інсталяції компонентів."
MaintenanceRepair: "Від&новити"
MaintenanceRepairText: "Виправляє помилки останньої інсталяції, відновлюючи відсутні та пошкоджені файли, ярлики й записи реєстру."
MaintenanceRemove: "В&идалити"
MaintenanceRemoveText: "Видаляє [ProductName] з комп'ютера."

ProgressTitle: "Інсталяція [ProductName]"
ProgressText: "Зачекайте, поки майстер інсталяції встановлює [ProductName]. Це може тривати кілька хвилин."
ProgressStatus: "Стан:"

ExitTitle: "Майстер інсталяції [ProductName] завершив роботу"
ExitText: "Натисніть «Готово», щоб вийти з майстра інсталяції."
UserExitTitle: "Роботу майстра інсталяції [ProductName] перервано"
UserExitText: "Інсталяцію [ProductName] перервано. Систему не змінено. Щоб інсталювати програму пізніше, знову запустіть майстер інсталяції. Натисніть «Готово», щоб вийти з майстра інсталяції."
FatalErrorTitle: "Майстер інсталяції [ProductName] завершив роботу передчасно"
FatalErrorText: "Інсталяцію [ProductName] передчасно завершено через помилку. Систему не змінено. Щоб інсталювати програму пізніше, знову запустіть майстер інсталяції. Натисніть «Готово», щоб вийти з майстра інсталяції."
ResumeTitle: "Відновлення роботи майстра інсталяції [ProductName]"
ResumeText: "Майстер інсталяції завершить інсталяцію [ProductName] на комп'ютері. Натисніть «Інсталювати», щоб продовжити, або «Скасувати», щоб вийти з майстра інсталяції."
