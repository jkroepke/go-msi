ReadyInstallTitle: "Všetko je pripravené na inštaláciu produktu [ProductName]"
ReadyInstallText: "Kliknutím na tlačidlo Inštalovať spustíte inštaláciu. Kliknutím na tlačidlo Späť môžete nastavenia skontrolovať alebo zmeniť. Kliknutím na tlačidlo Zrušiť sprievodcu ukončíte."
ReadyRepairTitle: "Všetko je pripravené na opravu produktu [ProductName]"
