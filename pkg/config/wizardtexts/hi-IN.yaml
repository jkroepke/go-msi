WelcomeTitle: "[ProductName] सेटअप विज़ार्ड में आपका स्वागत है"
WelcomeText: "सेटअप विज़ार्ड आपके कंप्यूटर पर [ProductName] इंस्टॉल करेगा। जारी रखने के लिए 'आगे' पर या सेटअप विज़ार्ड से बाहर निकलने के लिए 'रद्द करें' पर क्लिक करें।"

