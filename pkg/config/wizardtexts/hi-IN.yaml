ExitText: "सेटअप विज़ार्ड से बाहर निकलने के लिए 'समाप्त करें' पर क्लिक करें।"
UserExitTitle: "[ProductName] सेटअप विज़ार्ड बाधित हुआ"
UserExitText: "[ProductName] का सेटअप बाधित हुआ। आपके सिस्टम में कोई बदलाव नहीं किया गया। इस प्रोग्राम को बाद में इंस्टॉल करने के लिए सेटअप विज़ार्ड फिर से चलाएँ। सेटअप विज़ार्ड से बाहर निकलने के लिए 'समाप्त करें' पर क्लिक करें।"
FatalErrorTitle: "[ProductName] सेटअप विज़ार्ड समय से पहले समाप्त हुआ"
FatalErrorText: "किसी त्रुटि के कारण [ProductName] का सेटअप समय से पहले समाप्त हो गया। आपके सिस्टम में कोई बदलाव नहीं किया गया। इस प्रोग्राम को बाद में इंस्टॉल करने के लिए सेटअप विज़ार्ड फिर से चलाएँ। सेटअप विज़ार्ड से बाहर निकलने के लिए 'समाप्त करें' पर क्लिक करें।"
ResumeTitle: "[ProductName] सेटअप विज़ार्ड फिर से शुरू हो रहा है"
ResumeText: "सेटअप विज़ार्ड आपके कंप्यूटर पर [ProductName] का इंस्टॉलेशन पूरा करेगा। जारी रखने के लिए 'इंस्टॉल करें' पर या सेटअप विज़ार्ड से बाहर निकलने के लिए 'रद्द करें' पर क्लिक करें।"
