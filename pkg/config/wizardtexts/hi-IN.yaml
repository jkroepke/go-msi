FilesInUseTitle: "उपयोग में फ़ाइलें"
FilesInUseText: "अपडेट की जाने वाली कुछ फ़ाइलें अभी उपयोग में हैं।"
FilesInUseList: "निम्न ऐप्लिकेशन उन फ़ाइलों का उपयोग कर रहे हैं जिन्हें इस सेटअप को अपडेट करना है। इन ऐप्लिकेशन को बंद करें और जारी रखने के लिए 'पुनः प्रयास करें' पर क्लिक करें।"
