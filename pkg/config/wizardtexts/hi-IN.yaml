DiskCostTitle: "आवश्यक डिस्क स्थान"
DiskCostText: "चुनी गई सुविधाओं को इंस्टॉल करने के लिए आवश्यक डिस्क स्थान।"
DiskCostHint: "हाइलाइट किए गए वॉल्यूम पर चुनी गई सुविधाओं के लिए पर्याप्त डिस्क स्थान उपलब्ध नहीं है। आप हाइलाइट किए गए वॉल्यूम से कुछ फ़ाइलें हटा सकते हैं, कम सुविधाएँ इंस्टॉल कर सकते हैं या दूसरी गंतव्य ड्राइव चुन सकते हैं।"

