ReadyInstallTitle: "[ProductName] इंस्टॉल करने के लिए तैयार"
ReadyInstallText: "इंस्टॉलेशन शुरू करने के लिए 'इंस्टॉल करें' पर क्लिक करें। अपनी सेटिंग्स देखने या बदलने के लिए 'पीछे' पर क्लिक करें। विज़ार्ड से बाहर निकलने के लिए 'रद्द करें' पर क्लिक करें।"
ReadyRepairTitle: "[ProductName] सुधारने के लिए तैयार"
ReadyRepairText: "[ProductName] का इंस्टॉलेशन सुधारने के लिए 'सुधारें' पर क्लिक करें। रखरखाव मेनू पर लौटने के लिए 'पीछे' पर या विज़ार्ड से बाहर निकलने के लिए 'रद्द करें' पर क्लिक करें।"
ReadyRemoveTitle: "[ProductName] हटाएँ"
ReadyRemoveText: "अपने कंप्यूटर से [ProductName] हटाने के लिए 'हटाएँ' पर क्लिक करें। रखरखाव मेनू पर लौटने के लिए 'पीछे' पर या विज़ार्ड से बाहर निकलने के लिए 'रद्द करें' पर क्लिक करें।"

MaintenanceWelcomeTitle: "[ProductName] सेटअप विज़ार्ड में आपका स्वागत है"
MaintenanceWelcomeText: "सेटअप विज़ार्ड से आप बदल सकते हैं कि आपके कंप्यूटर पर [ProductName] की सुविधाएँ किस तरह इंस्टॉल हैं, या इसे अपने कंप्यूटर से हटा सकते हैं। जारी रखने के लिए 'आगे' पर या सेटअप विज़ार्ड से बाहर निकलने के लिए 'रद्द करें' पर क्लिक करें।"
MaintenanceTypeTitle: "इंस्टॉलेशन बदलें, सुधारें या हटाएँ"
MaintenanceTypeText: "वह कार्रवाई चुनें जिसे आप करना चाहते हैं।"
MaintenanceChange: "बदलें(&C)"
MaintenanceChangeText: "सुविधाओं को इंस्टॉल करने का तरीका बदलता है।"
MaintenanceRepair: "सुधारें(&P)"
MaintenanceRepairText: "गुम और क्षतिग्रस्त फ़ाइलों, शॉर्टकट और रजिस्ट्री प्रविष्टियों को ठीक करके पिछले इंस्टॉलेशन की त्रुटियाँ सुधारता है।"
MaintenanceRemove: "हटाएँ(&R)"
MaintenanceRemoveText: "आपके कंप्यूटर से [ProductName] हटाता है।"

