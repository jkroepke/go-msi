ReadyInstallTitle: "Готовност за инсталиране на [ProductName]"
ReadyInstallText: "Щракнете върху „Инсталиране“, за да започне инсталирането. Щракнете върху „Назад“, за да прегледате или промените настройките. Щракнете върху „Отказ“, за да излезете от съветника."
ReadyRepairTitle: "Готовност за поправяне на [ProductName]"
ReadyRepairText: "Щракнете върху „Поправяне“, за да поправите инсталацията на [ProductName]. Щракнете върху „Назад“, за да се върнете в менюто за поддръжка, или върху „Отказ“, за да излезете от съветника."
ReadyRemoveTitle: "Премахване на [ProductName]"
ReadyRemoveText: "Щракнете върху „Премахване“, за да премахнете [ProductName] от компютъра. Щракнете върху „Назад“, за да се върнете в менюто за поддръжка, или върху „Отказ“, за да излезете от съветника."

MaintenanceWelcomeTitle: "Добре дошли в съветника за инсталиране на [ProductName]"
MaintenanceWelcomeText: "Съветникът за инсталиране ви позволява да промените начина, по който са инсталирани компонентите на [ProductName] на компютъра, или да премахнете продукта от компютъра. Щракнете върху „Напред“, за да продължите, или върху „Отказ“, за да излезете от съветника."
MaintenanceTypeTitle: "Промяна, поправяне или премахване на инсталацията"
MaintenanceTypeText: "Изберете операцията, която искате да извършите."
MaintenanceChange: "П&ромяна"
MaintenanceChangeText: "Позволява да промените начина, по който са инсталирани компонентите."
MaintenanceRepair: "П&оправяне"
MaintenanceRepairText: "Поправя грешки в последната инсталация, като възстановява липсващи и повредени файлове, преки пътища и записи в системния регистър."
MaintenanceRemove: "Пре&махване"
MaintenanceRemoveText: "Премахва [ProductName] от компютъра."

ProgressTitle: "Инсталиране на [ProductName]"
ProgressText: "Изчакайте, докато съветникът за инсталиране инсталира [ProductName]. Това може да отнеме няколко минути."
ProgressStatus: "Състояние:"

ExitTitle: "Съветникът за инсталиране на [ProductName] приключи"
ExitText: "Щракнете върху „Готово“, за да излезете от съветника за инсталиране."
UserExitTitle: "Съветникът за инсталиране на [ProductName] беше прекъснат"
UserExitText: "Инсталирането на [ProductName] беше прекъснато. Системата не е променена. За да инсталирате програмата по-късно, стартирайте отново съветника за инсталиране. Щракнете върху „Готово“, за да излезете от съветника."
FatalErrorTitle: "Съветникът за инсталиране на [ProductName] приключи преждевременно"
FatalErrorText: "Инсталирането на [ProductName] приключи преждевременно поради грешка. Системата не е променена. За да инсталирате програмата по-късно, стартирайте отново съветника за инсталиране. Щракнете върху „Готово“, за да излезете от съветника."
ResumeTitle: "Възобновяване на съветника за инсталиране на [ProductName]"
ResumeText: "Съветникът за инсталиране ще завърши инсталирането на [ProductName] на компютъра. Щракнете върху „Инсталиране“, за да продължите, или върху „Отказ“, за да излезете от съветника."
Launch: "&Стартиране на [ProductName]"

