ReadyInstallTitle: "[ProductName] орнатуға дайын"
ReadyInstallText: "Орнатуды бастау үшін «Орнату» түймесін басыңыз. Параметрлерді қарау немесе өзгерту үшін «Артқа» түймесін басыңыз. Шеберден шығу үшін «Бас тарту» түймесін басыңыз."
ReadyRepairTitle: "[ProductName] қалпына келтіруге дайын"
ReadyRepairText: "[ProductName] орнатылымын қалпына келтіру үшін «Қалпына келтіру» түймесін басыңыз. Қызмет көрсету мәзіріне оралу үшін «Артқа», шеберден шығу үшін «Бас тарту» түймесін басыңыз."
ReadyRemoveTitle: "[ProductName] жою"
ReadyRemoveText: "[ProductName] бағдарламасын компьютерден жою үшін «Жою» түймесін басыңыз. Қызмет көрсету мәзіріне оралу үшін «Артқа», шеберден шығу үшін «Бас тарту» түймесін басыңыз."

MaintenanceWelcomeTitle: "[ProductName] орнату шеберіне қош келдіңіз"
