WelcomeTitle: "Καλώς ορίσατε στον Οδηγό εγκατάστασης του [ProductName]"
WelcomeText: "Ο Οδηγός εγκατάστασης θα εγκαταστήσει το [ProductName] στον υπολογιστή σας. Κάντε κλικ στο Επόμενο για να συνεχίσετε ή στο Άκυρο για έξοδο από τον Οδηγό εγκατάστασης."

