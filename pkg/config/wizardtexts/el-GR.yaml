DiskCostTitle: "Απαιτούμενος χώρος στο δίσκο"
DiskCostText: "Ο χώρος στο δίσκο που απαιτείται για την εγκατάσταση των επιλεγμένων δυνατοτήτων."
DiskCostHint: "Οι επισημασμένοι τόμοι δεν έχουν αρκετό ελεύθερο χώρο για τις επιλεγμένες δυνατότητες. Μπορείτε να καταργήσετε αρχεία από τους επισημασμένους τόμους, να εγκαταστήσετε λιγότερες δυνατότητες ή να επιλέξετε άλλες μονάδες προορισμού."

