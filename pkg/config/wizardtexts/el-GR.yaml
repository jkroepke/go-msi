InstallDirTitle: "Φάκελος προορισμού"
InstallDirText: "Κάντε κλικ στο Επόμενο για εγκατάσταση στον προεπιλεγμένο φάκελο ή στο Αλλαγή για να επιλέξετε άλλο φάκελο."
