# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2
before:
  hooks:
    - go mod tidy -diff

builds:
  - id: "msi-builder"
    binary: msi-builder
    main: ./cmd/msi-builder
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: '{{ .CommitTimestamp }}'
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X main.version={{.Version}}
        -X main.commit={{.Commit}}
        -X main.date={{.Date}}

archives:
  - id: msi-builder
    ids:
      - msi-builder
    formats: ['tar.gz']
    format_overrides:
      - goos: windows
        formats: ['zip']
    files:
      - LICENSE

dockers_v2:
  - ids:
      - msi-builder
    images:
      - ghcr.io/jkroepke/msi-builder
    tags:
      - '{{ .Version }}'
      - '{{ if and .Tag (not .Prerelease) (not .IsSnapshot) (ne .Branch "main") }}latest{{end}}'
      - '{{ if eq .Branch "main" }}main{{end}}'
    labels:
      "org.opencontainers.image.authors": 'Jan-Otto Kröpke https://github.com/jkroepke/'
      "org.opencontainers.image.created": '{{.Date}}'
      "org.opencontainers.image.description": 'Builds Windows Installer (MSI) packages from a YAML file, on Linux, macOS and Windows.'
      "org.opencontainers.image.documentation": 'https://github.com/jkroepke/msi-builder/wiki'
      "org.opencontainers.image.licenses": 'Apache-2.0'
      "org.opencontainers.image.revision": '{{.FullCommit}}'
      "org.opencontainers.image.source": 'https://github.com/jkroepke/msi-builder'
      "org.opencontainers.image.title": '{{.ProjectName}}'
      "org.opencontainers.image.vendor": 'Jan-Otto Kröpke'
      "org.opencontainers.image.version": '{{.Version}}'
    annotations:
      "org.opencontainers.image.authors": 'Jan-Otto Kröpke https://github.com/jkroepke/'
      "org.opencontainers.image.created": '{{.Date}}'
      "org.opencontainers.image.description": 'Builds Windows Installer (MSI) packages from a YAML file, on Linux, macOS and Windows.'
      "org.opencontainers.image.documentation": 'https://github.com/jkroepke/msi-builder/wiki'
      "org.opencontainers.image.licenses": 'Apache-2.0'
      "org.opencontainers.image.revision": '{{.FullCommit}}'
      "org.opencontainers.image.source": 'https://github.com/jkroepke/msi-builder'
      "org.opencontainers.image.title": '{{.ProjectName}}'
      "org.opencontainers.image.vendor": 'Jan-Otto Kröpke'
      "org.opencontainers.image.version": '{{.Version}}'
    platforms:
      - linux/amd64
      - linux/arm64

docker_signs:
  - artifacts: ''
    output: true
    cmd: cosign
    env:
      - COSIGN_EXPERIMENTAL=1
    args:
      - sign
      - '--oidc-issuer={{if index .Env "CI"}}https://token.actions.githubusercontent.com{{else}}https://oauth2.sigstore.dev/auth{{end}}'
      - '--yes'
      - '--use-signing-config=false'
      - '${artifact}@${digest}'

sboms:
  - artifacts: archive

report_sizes: true

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

gomod:
  proxy: true

release:
  draft: true
  replace_existing_draft: true
  prerelease: auto

changelog:
  use: github-native

# https://goreleaser.com/customization/attestations/
checksum:
  name_template: "checksums.txt"
